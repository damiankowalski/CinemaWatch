name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet run --project tests/CinemaWatch.Tests -c Release

      - name: Build app
        run: dotnet build src/CinemaWatch.App -c Release
